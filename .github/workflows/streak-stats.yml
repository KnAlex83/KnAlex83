name: Generate contribution snake

on:
  schedule:
    - cron: "0 */12 * * *"   # twice a day
  workflow_dispatch:          # run manually from the Actions tab

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg?color_snake=#E89A2E&color_dots=#ebedf0,#b3ecf7,#66d6ee,#1fb8d9,#0088a8
            dist/github-snake-dark.svg?palette=github-dark&color_snake=#FFB547&color_dots=#161b22,#0e3a4a,#0a6c85,#05a3c2,#00D9FF

      - uses: crazy-max/ghaction-github-pages@v5
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
