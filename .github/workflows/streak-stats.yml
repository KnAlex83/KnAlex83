name: Update streak stats

on:
  schedule:
    - cron: "0 2,14 * * *"
  push:
    paths:
      - ".github/workflows/streak-stats.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate streak stats
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&hide_border=true&disable_animations=true&background=0B1A2E&stroke=1E3A5F&ring=00D9FF&fire=FFB547&currStreakNum=EAF4FB&sideNums=EAF4FB&currStreakLabel=00D9FF&sideLabels=9FB3C8&dates=9FB3C8
          path: profile/streak.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Commit streak stats
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/streak.svg
          git commit -m "Update streak stats" || exit 0
          git push
