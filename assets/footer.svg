<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 130" width="1000" height="130" role="img" aria-label="Gratitude is my attitude. Thanks for stopping by.">
<style>.rays{animation:spin 24s linear infinite;transform-box:view-box;transform-origin:0 0}@keyframes spin{to{transform:rotate(360deg)}}@media (prefers-reduced-motion: reduce){ *{animation:none !important} }</style>
<defs><linearGradient id="bg" x1="0" x2="1"><stop offset="0" stop-color="#12284A"/><stop offset="1" stop-color="#0B1A2E"/></linearGradient></defs>
<rect x=".5" y=".5" width="999" height="129" rx="18" fill="url(#bg)" stroke="#FFB547" stroke-opacity=".2"/>
<g transform="translate(90 65)">
  <g class="rays" stroke="#FFB547" stroke-width="3" stroke-linecap="round"><line x1="0" y1="-22" x2="0" y2="-30" transform="rotate(0)"/><line x1="0" y1="-22" x2="0" y2="-30" transform="rotate(30)"/><line x1="0" y1="-22" x2="0" y2="-30" transform="rotate(60)"/><line x1="0" y1="-22" x2="0" y2="-30" transform="rotate(90)"/><line x1="0" y1="-22" x2="0" y2="-30" transform="rotate(120)"/><line x1="0" y1="-22" x2="0" y2="-30" transform="rotate(150)"/><line x1="0" y1="-22" x2="0" y2="-30" transform="rotate(180)"/><line x1="0" y1="-22" x2="0" y2="-30" transform="rotate(210)"/><line x1="0" y1="-22" x2="0" y2="-30" transform="rotate(240)"/><line x1="0" y1="-22" x2="0" y2="-30" transform="rotate(270)"/><line x1="0" y1="-22" x2="0" y2="-30" transform="rotate(300)"/><line x1="0" y1="-22" x2="0" y2="-30" transform="rotate(330)"/></g>
  <circle r="15" fill="#FFB547"/>
</g>
<text x="150" y="60" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="28" font-weight="700" fill="#EAF4FB">Gratitude is my attitude.</text>
<text x="151" y="90" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="16" fill="#9FB3C8">Thanks for stopping by. If you are building something real with AI, let’s talk.</text>
</svg>