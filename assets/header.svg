<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" width="1000" height="300" role="img" aria-label="KnAlex83. I build AI systems that run in production.">
<title>KnAlex83. I build AI systems that run in production.</title>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#0B1A2E"/><stop offset="1" stop-color="#12284A"/></linearGradient>
  <linearGradient id="wave" gradientUnits="userSpaceOnUse" x1="600" y1="0" x2="950" y2="0"><stop offset="0" stop-color="#00D9FF"/><stop offset="0.75" stop-color="#00D9FF"/><stop offset="1" stop-color="#FFB547"/></linearGradient>
  <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5"><stop offset="0" stop-color="#00D9FF" stop-opacity="0.18"/><stop offset="1" stop-color="#00D9FF" stop-opacity="0"/></radialGradient>
  <clipPath id="card"><rect width="1000" height="300" rx="20"/></clipPath>
</defs>
<style>
  .b{fill:url(#wave);transform-box:fill-box;transform-origin:center;animation-name:talk;animation-iteration-count:infinite;animation-direction:alternate;animation-timing-function:ease-in-out}
  @keyframes talk{0%{transform:scaleY(.25)}100%{transform:scaleY(1)}}
  .pulse{animation:pulse 2s ease-out infinite;transform-box:fill-box;transform-origin:center}
  @keyframes pulse{0%{transform:scale(1);opacity:.7}100%{transform:scale(3.2);opacity:0}}
  .line{stroke-dasharray:60 900;animation:run 4s linear infinite}
  @keyframes run{from{stroke-dashoffset:960}to{stroke-dashoffset:0}}
  @media (prefers-reduced-motion: reduce){ *{animation:none !important} }
</style>
<g clip-path="url(#card)">
  <rect width="1000" height="300" fill="url(#bg)"/>
  <ellipse cx="780" cy="150" rx="260" ry="150" fill="url(#glow)"/>
  <line x1="40" y1="260" x2="960" y2="260" stroke="#9FB3C8" stroke-opacity=".15"/>
  <line class="line" x1="40" y1="260" x2="960" y2="260" stroke="#00D9FF" stroke-width="2" stroke-linecap="round"/>
</g>
<rect x=".5" y=".5" width="999" height="299" rx="19.5" fill="none" stroke="#00D9FF" stroke-opacity=".18"/>
<text x="56" y="128" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="66" font-weight="800" letter-spacing="-1.5" fill="#EAF4FB">KnAlex83</text>
<text x="58" y="172" font-family="'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Ubuntu, Arial, sans-serif" font-size="23" fill="#9FB3C8">I build AI systems that run in production.</text>
<g transform="translate(66 214)">
  <circle r="6" fill="#FFB547" class="pulse"/>
  <circle r="6" fill="#FFB547"/>
